name: CI Orchestrator

# Main entry point for all CI workflows
# Analyzes metadata.json once and triggers downstream workflows conditionally

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_messages:
        description: 'Emoji trigger simulation (optional)'
        required: false
        type: string
        default: ''

concurrency:
  group: orchestrator-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Step 1: Call the metadata controller to analyze metadata.json
  controller:
    name: Analyze Metadata
    uses: ./.github/workflows/metadata-controller.yml
    with:
      event_name: ${{ github.event_name }}
      # For push events, join commit messages. For PRs, use an empty string.
      # workflow_dispatch can simulate emoji triggers via input.
      commit_messages: ${{ github.event_name == 'push' && join(github.event.commits.*.message, '\n') || (github.event_name == 'workflow_dispatch' && github.event.inputs.commit_messages) || '' }}

  # Step 2: Log the decisions (for debugging)
  log-decisions:
    name: Log Decisions
    needs: controller
    runs-on: ubuntu-latest
    steps:
      - name: Display workflow decisions
        run: |
          echo "============================================"
          echo "           📊 CI ORCHESTRATOR              "
          echo "============================================"
          echo ""
          echo "📦 Package Information:"
          echo "  Name: ${{ needs.controller.outputs.pkg_name }}"
          echo "  Version: ${{ needs.controller.outputs.version }}"
          echo "  Build Type: ${{ needs.controller.outputs.build_type }}"
          echo ""
          echo "🎯 Workflow Triggers:"
          echo "  🏗️  Build:      ${{ needs.controller.outputs.trigger_build }}"
          echo "  🧪 Tests:      ${{ needs.controller.outputs.trigger_tests }}"
          echo "  📦 Release:    ${{ needs.controller.outputs.trigger_release }}"
          echo "  📚 Docs:       ${{ needs.controller.outputs.trigger_docs }}"
          echo "  🛡️  Security:  ${{ needs.controller.outputs.trigger_security }}"
          echo ""
          echo "⚙️  Test Configuration:"
          echo "  Save Logs: ${{ needs.controller.outputs.saving_tests_log }}"
          echo "  Coverage:  ${{ needs.controller.outputs.activate_code_coverage }}"
          echo ""
          echo "============================================"

  # Step 2b: Enforce commit conventions (canonical form, see .github/misc/commitlint.config.js)
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint push commits
        if: github.event_name == 'push'
        run: |
          FROM="${{ github.event.before }}"
          if [[ "$FROM" == "0000000000000000000000000000000000000000" ]]; then
            # First push of a branch: only the last commit exists locally
            npx commitlint --config .github/misc/commitlint.config.js --from HEAD~1 --to HEAD --verbose
          else
            npx commitlint --config .github/misc/commitlint.config.js --from "$FROM" --to HEAD --verbose
          fi

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        run: printf '%s' "${{ github.event.pull_request.title }}" | npx commitlint --config .github/misc/commitlint.config.js

  # Step 2c: Validate metadata.json against the machine-readable contract
  schema-check:
    name: Metadata Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate metadata.json
        run: npx ajv validate -s .github/misc/metadata.schema.json -d metadata.json --spec=draft7

  # Step 3: Trigger downstream workflows based on controller outputs
  
  build:
    name: Build
    needs: controller
    if: needs.controller.outputs.trigger_build == 'true'
    uses: ./.github/workflows/ci-build-test.yml
    with:
      pkg_name: ${{ needs.controller.outputs.pkg_name }}

  tests:
    name: Tests
    needs: controller
    if: needs.controller.outputs.trigger_tests == 'true'
    uses: ./.github/workflows/full-test-automation.yml
    with:
      pkg_name: ${{ needs.controller.outputs.pkg_name }}
      saving_tests_log: ${{ needs.controller.outputs.saving_tests_log }}
      activate_code_coverage: ${{ needs.controller.outputs.activate_code_coverage }}

  release:
    name: Release
    needs: controller
    if: needs.controller.outputs.trigger_release == 'true'
    uses: ./.github/workflows/semver-release.yml
    secrets: inherit

  docs:
    name: Documentation
    needs: controller
    if: needs.controller.outputs.trigger_docs == 'true'
    uses: ./.github/workflows/docs-build.yml

  security:
    name: Security Scan
    needs: controller
    if: needs.controller.outputs.trigger_security == 'true'
    uses: ./.github/workflows/security-linters.yml
    with:
      validate_all_codebase: ${{ github.event_name == 'push' && 'true' || 'false' }}
    secrets: inherit

