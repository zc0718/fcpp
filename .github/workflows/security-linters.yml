name: MegaLinter

# This workflow is called by ci-orchestrator.yml when the :shield: gitmoji
# is present in commit messages.
#
# NOTE: The fcpp-dev branch has this workflow in debugging mode (triggers on
# push to fcpp-dev only). In the ci-orchestrator system, this workflow is
# triggered via workflow_call, and the gitmoji trigger logic is centralized
# in the metadata-controller.

on:
  workflow_call:
    inputs:
      validate_all_codebase:
        description: 'Whether to validate all source code or just the diff'
        required: false
        type: string
        default: 'false'

env:
  # Strict gate mode: never auto-fix in CI, lint failures fail the job.
  APPLY_FIXES: none

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-security
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libeigen3-dev zlib1g-dev libpcre2-dev
          # apt clang-format (v18 on noble) does NOT support the `Language: C`
          # config section (needs LLVM >= 19) — pin the pip build instead.
          python3 -m pip install clang-format==23.1.0

      # ETL is header-only and has no Ubuntu package; use the release archive
      # pinned to the same version as conandata.yml (etl/20.47.1).
      - name: Install ETL headers (pinned 20.47.1)
        run: |
          curl -sL -o /tmp/etl.zip https://github.com/ETLCPP/etl/archive/refs/tags/20.47.1.zip
          unzip -q /tmp/etl.zip -d /tmp/etl-src
          echo "ETL_INC=/tmp/etl-src/etl-20.47.1/include" >> "$GITHUB_ENV"

      # Required gate: formatting must be clean (same config as local dev)
      - name: clang-format gate
        run: |
          find include src -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror {} +

      # Required gate: static analysis, warning = failure (WarningsAsErrors in .clang-tidy).
      # Third-party headers come from apt and are treated as system headers, so only
      # repo diagnostics count (HeaderFilterRegex anchored to ^(include|src)/).
      - name: clang-tidy gate
        run: |
          shopt -s nullglob
          for f in src/*.c; do
            clang-tidy --config-file=.clang-tidy "$f" -- -std=c11 -Iinclude -I/usr/include/eigen3 -isystem "$ETL_INC"
          done
          for f in src/*.cpp; do
            clang-tidy --config-file=.clang-tidy "$f" -- -std=c++17 -Iinclude -I/usr/include/eigen3 -isystem "$ETL_INC"
          done

      # Required gate: secrets scan with pinned binary version
      - name: gitleaks gate
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect -c .gitleaks.toml --no-banner

  megalinter:
    name: MegaLinter (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check Grafana API reporter secrets
        id: check_grafana
        run: |
          if [[ -n "$API_URL" && -n "$API_USER" && -n "$API_PASS" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Grafana API reporter secrets are configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Grafana API reporter secrets not configured — will fallback to artifact upload"
          fi
        env:
          API_URL: ${{ secrets.API_REPORTER_URL }}
          API_USER: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
          API_PASS: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}

      # Run MegaLinter WITH Grafana API reporter when secrets are available
      # [advisory] semgrep/checkov/devskim run inside MegaLinter cannot be made
      # deterministic without runner log access (see REMEDIATION-PLAN.md F7);
      # the REQUIRED gates are the native quality-gates job above.
      - name: MegaLinter (with Grafana reporter)
        if: steps.check_grafana.outputs.available == 'true'
        uses: oxsecurity/megalinter@v8
        continue-on-error: true
        id: ml_grafana
        env:
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_REPORTER: true
          API_REPORTER_URL: ${{ secrets.API_REPORTER_URL }}
          API_REPORTER_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
          API_REPORTER_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}
          API_REPORTER_METRICS_URL: ${{ secrets.API_REPORTER_METRICS_URL }}
          API_REPORTER_METRICS_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_USERNAME }}
          API_REPORTER_METRICS_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_PASSWORD }}
          API_REPORTER_DEBUG: false

      # Run MegaLinter WITHOUT Grafana API reporter as fallback
      - name: MegaLinter (artifact-only)
        if: steps.check_grafana.outputs.available != 'true'
        uses: oxsecurity/megalinter@v8
        continue-on-error: true
        id: ml_fallback
        env:
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always upload artifacts as a safety net (works for both paths)
      - name: Archive production artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
