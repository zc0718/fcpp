name: Release

# This workflow can be triggered in two ways:
# 1. Via workflow_call from ci-orchestrator.yml (recommended)
# 2. Directly on push (for backward compatibility)

on:
  workflow_call:
    # No inputs needed - this workflow uses secrets

jobs:
  auto-release:
    name: Auto Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --extends .github/misc/.releaserc.json 2>&1 | tee /tmp/semantic-release.log

      - name: Emit release log
        if: always()
        run: |
          echo "::notice::visible tags: $(git tag -l | tr '\n' ' ')"
          echo "::notice::commits since v1.0.0: $(git rev-list v1.0.0..HEAD --count 2>/dev/null || echo N/A)"
          tail -n 40 /tmp/semantic-release.log | sed 's/^/::notice::/'

      - name: Emit release log on failure
        if: failure()
        run: |
          exit 1
